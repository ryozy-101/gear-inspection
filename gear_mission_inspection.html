<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GEAR MISSION 組付け検査</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif; background: #f5f5f5; display: flex; justify-content: center; padding: 12px; min-height: 100vh; }
#app { width: 100%; max-width: 420px; }

h1 { font-size: 16px; font-weight: 600; text-align: center; padding: 12px 0 10px; color: #111; letter-spacing: 0.05em; }

#video-container {
  position: relative;
  width: 100%;
  aspect-ratio: 4/3;
  background: #111;
  border-radius: 16px;
  overflow: hidden;
  border: 2px solid #ddd;
}
#video { width: 100%; height: 100%; object-fit: cover; display: block; }
#canvas { display: none; }
#overlay {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
#scan-box {
  width: 80%; height: 40%;
  border: 2px solid rgba(255,255,255,0.6);
  border-radius: 8px;
  position: relative;
}
.corner { position: absolute; width: 16px; height: 16px; border-color: white; border-style: solid; }
.tl { top:-2px; left:-2px; border-width:3px 0 0 3px; }
.tr { top:-2px; right:-2px; border-width:3px 3px 0 0; }
.bl { bottom:-2px; left:-2px; border-width:0 0 3px 3px; }
.br { bottom:-2px; right:-2px; border-width:0 3px 3px 0; }

#result-badge {
  display: none;
  position: absolute; top: 10px; left: 50%;
  transform: translateX(-50%);
  padding: 6px 18px;
  border-radius: 20px;
  font-size: 13px; font-weight: 600;
  white-space: nowrap;
}
.badge-ok { background: #1D9E75; color: white; }
.badge-ng { background: #E24B4A; color: white; }
.badge-wait { background: rgba(0,0,0,0.55); color: white; }

#status-bar {
  margin-top: 10px; padding: 14px 16px;
  border-radius: 16px;
  border: 1px solid #ddd;
  background: white;
  display: flex; align-items: center; gap: 12px;
  min-height: 60px;
}
#status-icon { font-size: 28px; width: 36px; text-align: center; flex-shrink: 0; }
#status-title { font-size: 15px; font-weight: 600; color: #111; }
#status-sub { font-size: 12px; color: #888; margin-top: 2px; }

#btn-row { display: flex; gap: 8px; margin-top: 8px; }
#btn-start, #btn-stop {
  flex: 1; padding: 13px;
  border-radius: 10px;
  font-size: 15px; font-weight: 600;
  cursor: pointer; border: none;
}
#btn-start { background: #1D9E75; color: white; }
#btn-stop { background: #eee; color: #333; display: none; }

#ocr-result-box {
  margin-top: 8px; padding: 10px 14px;
  border-radius: 10px;
  background: #f0f0f0;
  font-size: 12px; color: #666;
  min-height: 36px; word-break: break-all;
}

#counter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.count-card {
  padding: 12px 14px; border-radius: 10px;
  border: 1px solid #ddd; background: white; text-align: center;
}
.count-label { font-size: 11px; color: #888; }
.count-val { font-size: 26px; font-weight: 700; margin-top: 2px; }
.ok-val { color: #1D9E75; }
.ng-val { color: #E24B4A; }
</style>
</head>
<body>
<div id="app">
  <h1>GEAR MISSION 組付け検査</h1>

  <div id="video-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="overlay">
      <div id="scan-box">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
      </div>
    </div>
    <div id="result-badge" class="badge-wait">カメラを起動してください</div>
  </div>

  <div id="status-bar">
    <div id="status-icon">📷</div>
    <div id="status-text">
      <div id="status-title">カメラを起動してください</div>
      <div id="status-sub">「検査開始」ボタンを押してください</div>
    </div>
  </div>

  <div id="btn-row">
    <button id="btn-start" onclick="startCamera()">▶ 検査開始</button>
    <button id="btn-stop" onclick="stopCamera()">⏹ 停止</button>
  </div>

  <div id="ocr-result-box">認識テキスト：（待機中）</div>

  <div id="counter-row">
    <div class="count-card">
      <div class="count-label">OK 件数</div>
      <div class="count-val ok-val" id="ok-count">0</div>
    </div>
    <div class="count-card">
      <div class="count-label">NG 件数</div>
      <div class="count-val ng-val" id="ng-count">0</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
let stream = null, scanning = false, intervalId = null;
let okCount = 0, ngCount = 0;
let workerReady = false, worker = null, audioCtx = null;
let lastResult = null;

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusIcon = document.getElementById('status-icon');
const statusTitle = document.getElementById('status-title');
const statusSub = document.getElementById('status-sub');
const statusBar = document.getElementById('status-bar');
const resultBadge = document.getElementById('result-badge');
const ocrBox = document.getElementById('ocr-result-box');
const btnStart = document.getElementById('btn-start');
const btnStop = document.getElementById('btn-stop');
const okEl = document.getElementById('ok-count');
const ngEl = document.getElementById('ng-count');

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playOK() {
  try {
    const ac = getAudioCtx();
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.setValueAtTime(880, ac.currentTime);
    o.frequency.setValueAtTime(1100, ac.currentTime + 0.1);
    g.gain.setValueAtTime(0.3, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.3);
    o.start(); o.stop(ac.currentTime + 0.3);
  } catch(e) {}
}
function playNG() {
  try {
    const ac = getAudioCtx();
    for (let i = 0; i < 3; i++) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(220, ac.currentTime + i * 0.2);
      g.gain.setValueAtTime(0.4, ac.currentTime + i * 0.2);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + i * 0.2 + 0.18);
      o.start(ac.currentTime + i * 0.2);
      o.stop(ac.currentTime + i * 0.2 + 0.18);
    }
  } catch(e) {}
}

function setStatus(type) {
  statusBar.style.border = '';
  resultBadge.style.display = 'block';
  resultBadge.className = '';
  if (type === 'ok') {
    statusIcon.textContent = '✅';
    statusTitle.textContent = 'OK — 正常な組付け';
    statusTitle.style.color = '#1D9E75';
    statusSub.textContent = 'GEAR MISSION が正位置で読めました';
    statusBar.style.border = '2px solid #1D9E75';
    resultBadge.className = 'badge-ok';
    resultBadge.textContent = '✓ OK';
  } else if (type === 'ng') {
    statusIcon.textContent = '🚨';
    statusTitle.textContent = 'NG — 上下逆！';
    statusTitle.style.color = '#E24B4A';
    statusSub.textContent = '組付け方向を確認してください';
    statusBar.style.border = '2px solid #E24B4A';
    resultBadge.className = 'badge-ng';
    resultBadge.textContent = '✗ NG 逆向き';
  } else if (type === 'scanning') {
    statusIcon.textContent = '🔍';
    statusTitle.textContent = '認識中...';
    statusTitle.style.color = '#111';
    statusSub.textContent = '枠内にGEAR MISSIONの文字を合わせてください';
    resultBadge.className = 'badge-wait';
    resultBadge.textContent = '認識中...';
  } else {
    statusIcon.textContent = '📷';
    statusTitle.textContent = 'カメラを起動してください';
    statusTitle.style.color = '#111';
    statusSub.textContent = '「検査開始」ボタンを押してください';
    resultBadge.style.display = 'none';
  }
}

async function initWorker() {
  try {
    worker = await Tesseract.createWorker('eng', 1, { logger: () => {} });
    workerReady = true;
  } catch(e) {
    statusSub.textContent = 'OCRエンジンの初期化に失敗しました';
  }
}

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 960 } }
    });
    video.srcObject = stream;
    scanning = true;
    btnStart.style.display = 'none';
    btnStop.style.display = 'block';
    resultBadge.style.display = 'block';
    setStatus('scanning');
    if (!workerReady) {
      statusSub.textContent = 'OCRエンジン初期化中...';
      await initWorker();
    }
    intervalId = setInterval(doOCR, 1500);
  } catch(e) {
    statusTitle.textContent = 'カメラへのアクセスを許可してください';
    statusSub.textContent = 'ブラウザの設定でカメラを許可してください';
  }
}

function stopCamera() {
  scanning = false;
  clearInterval(intervalId);
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
  btnStart.style.display = 'block';
  btnStop.style.display = 'none';
  setStatus('idle');
  ocrBox.textContent = '認識テキスト：（待機中）';
}

async function doOCR() {
  if (!scanning || !workerReady || video.videoWidth === 0) return;
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0);
  const w = canvas.width, h = canvas.height;
  const imageData = canvas.toDataURL('image/png');
  try {
    const result = await worker.recognize(imageData, {
      rectangle: { top: Math.round(h*0.3), left: Math.round(w*0.1), width: Math.round(w*0.8), height: Math.round(h*0.4) }
    });
    const text = result.data.text.toUpperCase().replace(/\s+/g, ' ').trim();
    ocrBox.textContent = '認識テキスト：' + (text || '（テキストなし）');
    const hasNormal = /GEAR\s*MISSION/.test(text);
    const hasReversed = /NOISSIM|RAEG|NOISS/.test(text);
    if (hasNormal && !hasReversed) {
      if (lastResult !== 'ok') { lastResult = 'ok'; okCount++; okEl.textContent = okCount; setStatus('ok'); playOK(); }
    } else if (hasReversed) {
      if (lastResult !== 'ng') { lastResult = 'ng'; ngCount++; ngEl.textContent = ngCount; setStatus('ng'); playNG(); }
    } else {
      lastResult = null; setStatus('scanning');
    }
  } catch(e) {
    ocrBox.textContent = '認識エラー：再試行中...';
  }
}

initWorker();
</script>
</body>
</html>
