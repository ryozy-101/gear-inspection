<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GEAR MISSION 上下検査</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif; background: #f5f5f5; display: flex; justify-content: center; padding: 6px; min-height: 100vh; }
#app { width: 100%; max-width: 440px; padding-bottom: 10px; }
h1 { font-size: 14px; font-weight: 600; text-align: center; padding: 6px 0; color: #111; }

#video-container {
  position: relative; width: 100%; height: 0; padding-top: 100%;
  background: #111; border-radius: 12px; overflow: hidden; border: 2px solid #ddd;
}
#video { position: absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; display:block; }
#canvas { display: none; }
#zone-overlay { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
.zone-box {
  position: absolute; border: 2px dashed rgba(255,220,0,0.9);
  border-radius: 4px; display: flex; align-items: flex-start; justify-content: flex-start; padding: 2px;
}
.zone-label { background: rgba(0,0,0,0.55); color: white; font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 3px; pointer-events: none; }
.zone-box.edit-mode { border-style: solid; border-width: 2px; cursor: move; }
.zone-resize-handle {
  position: absolute; bottom: -6px; right: -6px;
  width: 14px; height: 14px; background: white; border: 2px solid #333;
  border-radius: 3px; cursor: se-resize; display: none;
}
.zone-box.edit-mode .zone-resize-handle { display: block; }

#zone-gm { top:18%; left:5%; width:88%; height:22%; }

#result-badge {
  display: none; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
  padding: 5px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; white-space: nowrap; z-index: 10;
}
.badge-ok { background: #1D9E75; color: white; }
.badge-ng { background: #E24B4A; color: white; }
.badge-wait { background: rgba(0,0,0,0.55); color: white; }

#status-bar {
  margin-top: 6px; padding: 8px 12px; border-radius: 12px;
  border: 1px solid #ddd; background: white;
  display: flex; align-items: center; gap: 8px; min-height: 46px;
}
#status-icon { font-size: 22px; width: 28px; text-align: center; flex-shrink: 0; }
#status-title { font-size: 13px; font-weight: 600; color: #111; }
#status-sub { font-size: 10px; color: #888; margin-top: 1px; }

#btn-row { display: flex; gap: 6px; margin-top: 6px; }
#btn-start, #btn-stop { flex: 1; padding: 10px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; }
#btn-start { background: #1D9E75; color: white; }
#btn-stop { background: #eee; color: #333; display: none; }
#btn-mirror { flex: 0 0 auto; padding: 10px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; background: #eee; color: #333; display: none; }
#btn-mirror.active { background: #1D9E75; color: white; }

#btn-edit-zone {
  width:100%; padding:8px; margin-top:4px; margin-bottom:6px; border-radius:10px;
  font-size:13px; font-weight:600; cursor:pointer;
  border:1px dashed #aaa; background:#fff; color:#555;
}
#btn-edit-zone.active { background:#2563EB; color:white; border:none; }
#edit-hint { display:none; margin-top:4px; padding:8px 12px; background:#fffbe6; border-radius:8px; border:1px solid #ffe58f; font-size:11px; color:#7d6608; line-height:1.6; }

#btn-alarm-stop {
  width: 100%; padding: 11px; border-radius: 10px; font-size: 15px; font-weight: 700;
  cursor: pointer; border: none; background: #E24B4A; color: white; display: none; margin-top: 6px;
  animation: pulse 0.6s infinite alternate;
}
@keyframes pulse { from { opacity:1; } to { opacity:0.6; } }

#check-result-panel { margin-top: 6px; border-radius: 12px; border: 1px solid #ddd; background: white; overflow: hidden; display: none; }
#check-result-title { padding: 8px 12px; font-size: 12px; font-weight: 700; background: #f8f8f8; border-bottom: 1px solid #eee; color: #333; }
.check-item { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid #f0f0f0; }
.check-item:last-child { border-bottom: none; }
.check-badge { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
.check-label { flex: 1; color: #333; font-size: 11px; }
.check-status { font-size: 11px; font-weight: 700; }
.s-ok { color: #1D9E75; } .s-ng { color: #E24B4A; } .s-wait { color: #888; }

#counter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
.count-card { padding: 7px 10px; border-radius: 10px; border: 1px solid #ddd; background: white; text-align: center; }
.count-label { font-size: 11px; color: #888; }
.count-val { font-size: 22px; font-weight: 700; margin-top: 1px; }
.ok-val { color: #1D9E75; } .ng-val { color: #E24B4A; }

/* OCRデバッグ表示 */
#debug-panel { margin-top: 6px; padding: 8px 12px; background: #f0f0f0; border-radius: 10px; font-size: 10px; color: #555; display: none; line-height: 1.7; }
</style>
</head>
<body>
<div id="app">
  <h1>GEAR MISSION 上下検査</h1>

  <button id="btn-edit-zone" onclick="toggleEditMode()">✏️ 枠の位置・サイズを調整する</button>
  <div id="edit-hint">📌 枠をドラッグ→移動　角の白い四角をドラッグ→サイズ変更<br>調整完了後「調整完了」を押すと保存されます。</div>

  <div id="video-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="zone-overlay">
      <div class="zone-box" id="zone-gm">
        <span class="zone-label">GEAR MISSION 検出枠</span>
        <div class="zone-resize-handle"></div>
      </div>
    </div>
    <div id="result-badge" class="badge-wait">カメラを起動してください</div>
  </div>

  <div id="status-bar">
    <div id="status-icon">📷</div>
    <div id="status-text">
      <div id="status-title">カメラを起動してください</div>
      <div id="status-sub">「検査開始」ボタンを押してください</div>
    </div>
  </div>

  <div id="btn-row">
    <button id="btn-start" onclick="startCamera()">▶ 検査開始</button>
    <button id="btn-stop" onclick="stopCamera()">⏹ 停止</button>
    <button id="btn-mirror" onclick="toggleMirror()">🔄 切替</button>
  </div>

  <button id="btn-alarm-stop" onclick="stopAlarm()">🔕 アラーム停止（タップして解除）</button>

  <div id="check-result-panel">
    <div id="check-result-title">📋 検査結果</div>
    <div class="check-item" id="r-item-1">
      <span class="check-badge">―</span>
      <span class="check-label">GEAR MISSION 上下方向（OCR）</span>
      <span class="check-status s-wait">―</span>
    </div>
  </div>

  <div id="counter-row">
    <div class="count-card"><div class="count-label">OK 件数</div><div class="count-val ok-val" id="ok-count">0</div></div>
    <div class="count-card"><div class="count-label">NG 件数</div><div class="count-val ng-val" id="ng-count">0</div></div>
  </div>

  <!-- デバッグ表示（OCRの生テキスト確認用） -->
  <div id="debug-panel">
    <strong>🔬 OCRデバッグ</strong><br>
    正位置スコア: <span id="dbg-normal">-</span><br>
    180°回転スコア: <span id="dbg-flipped">-</span><br>
    正位置テキスト: <span id="dbg-text-n">-</span><br>
    回転テキスト: <span id="dbg-text-f">-</span>
  </div>
  <button onclick="toggleDebug()" style="width:100%;margin-top:6px;padding:6px;border-radius:8px;border:1px solid #ccc;background:#fff;font-size:11px;color:#888;cursor:pointer;">🔬 デバッグ表示 ON/OFF</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const ZONE_STORAGE_KEY = 'gm_ocr_zone';

// GEAR MISSIONゾーン [top, left, width, height]（比率）
let ZONE_GM = [0.18, 0.05, 0.88, 0.22];

let stream=null, scanning=false, intervalId=null;
let okCount=0, ngCount=0;
let workerReady=false, worker=null, audioCtx=null;
let lastResult=null, alarmActive=false, alarmInterval=null, mirrored=false;
let editMode=false, debugVisible=false;

const video   = document.getElementById('video');
const canvas  = document.getElementById('canvas');
const ctx     = canvas.getContext('2d');
const statusIcon  = document.getElementById('status-icon');
const statusTitle = document.getElementById('status-title');
const statusSub   = document.getElementById('status-sub');
const statusBar   = document.getElementById('status-bar');
const resultBadge = document.getElementById('result-badge');
const okEl = document.getElementById('ok-count');
const ngEl = document.getElementById('ng-count');

// ===== デバッグ =====
function toggleDebug(){
  debugVisible=!debugVisible;
  document.getElementById('debug-panel').style.display=debugVisible?'block':'none';
}

// ===== 音声 =====
function getAudioCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playOK(){
  try{const ac=getAudioCtx(),o=ac.createOscillator(),g=ac.createGain();
  o.connect(g);g.connect(ac.destination);
  o.frequency.setValueAtTime(880,ac.currentTime);o.frequency.setValueAtTime(1100,ac.currentTime+0.1);
  g.gain.setValueAtTime(1.0,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.4);
  o.start();o.stop(ac.currentTime+0.4);}catch(e){}
}
function playNGBeep(){
  try{const ac=getAudioCtx();
  const wave=ac.createWaveShaper();const curve=new Float32Array(256);
  for(let i=0;i<256;i++){const x=(i*2)/256-1;curve[i]=(Math.PI+400)*x/(Math.PI+400*Math.abs(x));}
  wave.curve=curve;wave.oversample='4x';
  const mg=ac.createGain();mg.gain.setValueAtTime(2.0,ac.currentTime);wave.connect(mg);mg.connect(ac.destination);
  for(let i=0;i<3;i++){const o1=ac.createOscillator(),o2=ac.createOscillator(),g1=ac.createGain();
  o1.type='sawtooth';o2.type='square';
  o1.frequency.setValueAtTime(440,ac.currentTime+i*0.25);o2.frequency.setValueAtTime(443,ac.currentTime+i*0.25);
  g1.gain.setValueAtTime(1.0,ac.currentTime+i*0.25);g1.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+i*0.25+0.22);
  o1.connect(g1);o2.connect(g1);g1.connect(wave);
  o1.start(ac.currentTime+i*0.25);o1.stop(ac.currentTime+i*0.25+0.22);
  o2.start(ac.currentTime+i*0.25);o2.stop(ac.currentTime+i*0.25+0.22);}
  }catch(e){}
}
function startAlarm(){
  if(alarmActive)return;alarmActive=true;
  document.getElementById('btn-alarm-stop').style.display='block';
  playNGBeep();alarmInterval=setInterval(()=>{if(alarmActive)playNGBeep();},1000);
}
function stopAlarm(){
  alarmActive=false;clearInterval(alarmInterval);alarmInterval=null;
  document.getElementById('btn-alarm-stop').style.display='none';
  lastResult=null;setStatus('scanning');
}

// ===== カメラ =====
function toggleMirror(){
  mirrored=!mirrored;const btn=document.getElementById('btn-mirror');
  btn.classList.toggle('active',mirrored);btn.textContent=mirrored?'📷前面':'🔄切替';restartCamera();
}
async function restartCamera(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}clearInterval(intervalId);
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:mirrored?'user':'environment',width:{ideal:960},height:{ideal:1280}}});
  video.srcObject=stream;intervalId=setInterval(runInspection,1500);}
  catch(e){statusSub.textContent='カメラの切り替えに失敗しました';}
}
async function startCamera(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:960},height:{ideal:1280}}});
    video.srcObject=stream;scanning=true;
    document.getElementById('btn-start').style.display='none';
    document.getElementById('btn-stop').style.display='block';
    document.getElementById('btn-mirror').style.display='block';
    document.getElementById('check-result-panel').style.display='block';
    resultBadge.style.display='block';setStatus('scanning');
    if(!workerReady){statusSub.textContent='OCRエンジン初期化中...';await initWorker();}
    intervalId=setInterval(runInspection,1500);
  }catch(e){
    statusTitle.textContent='カメラへのアクセスを許可してください';
    statusSub.textContent='ブラウザの設定でカメラを許可してください';
  }
}
function stopCamera(){
  scanning=false;clearInterval(intervalId);
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  video.srcObject=null;
  document.getElementById('btn-start').style.display='block';
  document.getElementById('btn-stop').style.display='none';
  document.getElementById('btn-mirror').style.display='none';
  document.getElementById('btn-mirror').textContent='🔄切替';
  mirrored=false;stopAlarm();setStatus('idle');
}

// ===== ステータス =====
function setStatus(type,sub){
  statusBar.style.border='';resultBadge.style.display='block';resultBadge.className='';
  if(type==='ok'){
    statusIcon.textContent='✅';statusTitle.textContent='OK — 正常な向き';statusTitle.style.color='#1D9E75';
    statusSub.textContent=sub||'GEAR MISSIONは正位置です';statusBar.style.border='2px solid #1D9E75';
    resultBadge.className='badge-ok';resultBadge.textContent='✓ OK';
  }else if(type==='ng'){
    statusIcon.textContent='🚨';statusTitle.textContent='NG — 上下逆！';statusTitle.style.color='#E24B4A';
    statusSub.textContent=sub||'GEAR MISSIONが上下逆です';statusBar.style.border='2px solid #E24B4A';
    resultBadge.className='badge-ng';resultBadge.textContent='✗ NG 上下逆';
  }else if(type==='scanning'){
    statusIcon.textContent='🔍';statusTitle.textContent='検査中...';statusTitle.style.color='#111';
    statusSub.textContent='GEAR MISSIONをカメラに映してください';
    resultBadge.className='badge-wait';resultBadge.textContent='検査中...';
  }else{
    statusIcon.textContent='📷';statusTitle.textContent='カメラを起動してください';statusTitle.style.color='#111';
    statusSub.textContent='「検査開始」ボタンを押してください';resultBadge.style.display='none';
  }
}
function setCheckItem(status){
  const item=document.getElementById('r-item-1');
  const badge=item.querySelector('.check-badge'),st=item.querySelector('.check-status');
  if(status==='ok'){badge.textContent='✅';st.textContent='OK 正位置';st.className='check-status s-ok';item.style.background='#f0faf5';}
  else if(status==='ng'){badge.textContent='❌';st.textContent='NG 上下逆！';st.className='check-status s-ng';item.style.background='#fff0f0';}
  else{badge.textContent='―';st.textContent='―';st.className='check-status s-wait';item.style.background='';}
}

// ===== OCR =====
async function initWorker(){
  try{worker=await Tesseract.createWorker('eng',1,{logger:()=>{}});workerReady=true;}
  catch(e){statusSub.textContent='OCRエンジンの初期化に失敗しました';}
}

// ===== ゾーン切り出し＋前処理 =====
function extractAndPreprocess(srcCanvas){
  const z=ZONE_GM;
  const w=srcCanvas.width, h=srcCanvas.height;
  const zx=Math.round(z[1]*w), zy=Math.round(z[0]*h);
  const zw=Math.round(z[2]*w), zh=Math.round(z[3]*h);

  // 2倍拡大
  const zoneCanvas=document.createElement('canvas');
  zoneCanvas.width=zw*2; zoneCanvas.height=zh*2;
  const zc=zoneCanvas.getContext('2d');
  zc.drawImage(srcCanvas, zx, zy, zw, zh, 0, 0, zw*2, zh*2);

  // グレースケール＋二値化
  const id=zc.getImageData(0, 0, zoneCanvas.width, zoneCanvas.height);
  for(let i=0; i<id.data.length; i+=4){
    const g=0.299*id.data[i]+0.587*id.data[i+1]+0.114*id.data[i+2];
    id.data[i]=id.data[i+1]=id.data[i+2]=(g<128?0:255);
  }
  zc.putImageData(id, 0, 0);
  return zoneCanvas;
}

function rotate180(srcCanvas){
  const c=document.createElement('canvas');
  c.width=srcCanvas.width; c.height=srcCanvas.height;
  const rc=c.getContext('2d');
  rc.translate(c.width/2, c.height/2);
  rc.rotate(Math.PI);
  rc.drawImage(srcCanvas, -c.width/2, -c.height/2);
  return c;
}

// ===== 検査処理 =====
async function runInspection(){
  if(!scanning||!workerReady||video.videoWidth===0)return;
  canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  ctx.drawImage(video,0,0);

  try{
    const zoneCanvas=extractAndPreprocess(canvas);
    const rotCanvas=rotate180(zoneCanvas);

    // 正位置と180°回転を並列OCR
    const [rNormal, rFlipped]=await Promise.all([
      worker.recognize(zoneCanvas.toDataURL()),
      worker.recognize(rotCanvas.toDataURL())
    ]);

    const tN=rNormal.data.text.toUpperCase().replace(/\s+/g,'');
    const tF=rFlipped.data.text.toUpperCase().replace(/\s+/g,'');

    // スコア計算（部分一致も含めて幅広く）
    const keywords=['GEAR','MISSION','GEA','EAR','MIS','ION','MISS'];
    const scoreN=keywords.filter(k=>tN.includes(k)).length;
    const scoreF=keywords.filter(k=>tF.includes(k)).length;

    // デバッグ表示
    if(debugVisible){
      document.getElementById('dbg-normal').textContent=scoreN;
      document.getElementById('dbg-flipped').textContent=scoreF;
      document.getElementById('dbg-text-n').textContent=tN.slice(0,30);
      document.getElementById('dbg-text-f').textContent=tF.slice(0,30);
    }

    if(scoreN===0&&scoreF===0){
      // 読めない→判定不能
      setCheckItem(null);
      if(!alarmActive)setStatus('scanning','文字が読み取れません。枠を調整してください');
      return;
    }

    if(scoreF>scoreN){
      // 回転版の方がスコア高い→上下逆
      setCheckItem('ng');
      if(lastResult!=='ng'){
        lastResult='ng';ngCount++;ngEl.textContent=ngCount;
        setStatus('ng');startAlarm();
      }
    }else{
      // 正位置の方がスコア高い→正常
      setCheckItem('ok');
      if(lastResult!=='ok'){
        lastResult='ok';okCount++;okEl.textContent=okCount;
        setStatus('ok');playOK();
      }
    }
  }catch(e){}
}

// ===== 枠調整モード =====
function toggleEditMode(){
  editMode=!editMode;
  const btn=document.getElementById('btn-edit-zone');
  const hint=document.getElementById('edit-hint');
  const overlay=document.getElementById('zone-overlay');
  if(editMode){
    btn.textContent='✅ 調整完了（タップして保存）';btn.classList.add('active');
    hint.style.display='block';overlay.style.pointerEvents='auto';
    document.querySelectorAll('.zone-box').forEach(z=>z.classList.add('edit-mode'));
  }else{
    btn.textContent='✏️ 枠の位置・サイズを調整する';btn.classList.remove('active');
    hint.style.display='none';overlay.style.pointerEvents='none';
    document.querySelectorAll('.zone-box').forEach(z=>z.classList.remove('edit-mode'));
    saveZonePosition();
  }
}
function saveZonePosition(){
  const container=document.getElementById('video-container');
  const cw=container.offsetWidth, ch=container.offsetHeight;
  const el=document.getElementById('zone-gm');
  const top=parseFloat(el.style.top)/ch;
  const left=parseFloat(el.style.left)/cw;
  const width=parseFloat(el.style.width)/cw;
  const height=parseFloat(el.style.height)/ch;
  ZONE_GM=[top,left,width,height];
  try{localStorage.setItem(ZONE_STORAGE_KEY,JSON.stringify(ZONE_GM));}catch(e){}
  alert('✅ 枠の位置を保存しました！');
}
function loadZonePosition(){
  const container=document.getElementById('video-container');
  const cw=container.offsetWidth||1, ch=container.offsetHeight||1;
  try{
    const saved=localStorage.getItem(ZONE_STORAGE_KEY);
    if(saved){ZONE_GM=JSON.parse(saved);}
  }catch(e){}
  const z=ZONE_GM;
  const el=document.getElementById('zone-gm');
  el.style.top=(z[0]*ch)+'px';el.style.left=(z[1]*cw)+'px';
  el.style.width=(z[2]*cw)+'px';el.style.height=(z[3]*ch)+'px';
}
function initZoneDrag(){
  const zone=document.getElementById('zone-gm');
  const handle=zone.querySelector('.zone-resize-handle');
  const container=document.getElementById('video-container');
  let dragging=false,resizing=false,startX,startY,startL,startT,startW,startH;

  zone.addEventListener('touchstart',e=>{
    if(!editMode||e.target===handle)return;
    dragging=true;const t=e.touches[0];startX=t.clientX;startY=t.clientY;
    startL=parseFloat(zone.style.left)||0;startT=parseFloat(zone.style.top)||0;e.stopPropagation();
  },{passive:true});
  zone.addEventListener('touchmove',e=>{
    if(!dragging||!editMode)return;const t=e.touches[0];
    const dx=t.clientX-startX,dy=t.clientY-startY;
    const cw=container.offsetWidth,ch=container.offsetHeight;
    zone.style.left=Math.max(0,Math.min(cw-parseFloat(zone.style.width),startL+dx))+'px';
    zone.style.top=Math.max(0,Math.min(ch-parseFloat(zone.style.height),startT+dy))+'px';
    e.preventDefault();
  },{passive:false});
  zone.addEventListener('touchend',()=>{dragging=false;});

  handle.addEventListener('touchstart',e=>{
    if(!editMode)return;resizing=true;const t=e.touches[0];
    startX=t.clientX;startY=t.clientY;startW=parseFloat(zone.style.width)||50;startH=parseFloat(zone.style.height)||50;
    e.stopPropagation();
  },{passive:true});
  handle.addEventListener('touchmove',e=>{
    if(!resizing||!editMode)return;const t=e.touches[0];
    const dx=t.clientX-startX,dy=t.clientY-startY;
    const cw=container.offsetWidth,ch=container.offsetHeight;
    zone.style.width=Math.max(30,Math.min(cw-parseFloat(zone.style.left),startW+dx))+'px';
    zone.style.height=Math.max(20,Math.min(ch-parseFloat(zone.style.top),startH+dy))+'px';
    e.preventDefault();
  },{passive:false});
  handle.addEventListener('touchend',()=>{resizing=false;});

  zone.addEventListener('mousedown',e=>{
    if(!editMode||e.target===handle)return;dragging=true;
    startX=e.clientX;startY=e.clientY;startL=parseFloat(zone.style.left)||0;startT=parseFloat(zone.style.top)||0;e.preventDefault();
  });
  document.addEventListener('mousemove',e=>{
    if(dragging&&editMode){const dx=e.clientX-startX,dy=e.clientY-startY;const cw=container.offsetWidth,ch=container.offsetHeight;
    zone.style.left=Math.max(0,Math.min(cw-parseFloat(zone.style.width),startL+dx))+'px';
    zone.style.top=Math.max(0,Math.min(ch-parseFloat(zone.style.height),startT+dy))+'px';}
    if(resizing&&editMode){const dx=e.clientX-startX,dy=e.clientY-startY;const cw=container.offsetWidth,ch=container.offsetHeight;
    zone.style.width=Math.max(30,Math.min(cw-parseFloat(zone.style.left),startW+dx))+'px';
    zone.style.height=Math.max(20,Math.min(ch-parseFloat(zone.style.top),startH+dy))+'px';}
  });
  document.addEventListener('mouseup',()=>{dragging=false;resizing=false;});
  handle.addEventListener('mousedown',e=>{
    if(!editMode)return;resizing=true;startX=e.clientX;startY=e.clientY;
    startW=parseFloat(zone.style.width)||50;startH=parseFloat(zone.style.height)||50;
    e.preventDefault();e.stopPropagation();
  });
}

initWorker();
window.addEventListener('load',()=>{
  setTimeout(()=>{loadZonePosition();initZoneDrag();},100);
});
</script>
